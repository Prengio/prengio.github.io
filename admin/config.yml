backend:
  name: github
  repo: Prengio/prengio.github.site
  branch: main
  auth_type: implicit
  app_id: Ov23lihNcDe1qGrmfFch

media_folder: "assets/img"
public_folder: "/assets/img"



collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Related Posts", name: "related_posts", widget: "boolean", default: false }
      - { label: "Use MathJax", name: "usemathjax", widget: "boolean", default: false }
      - { label: "Giscus Comments", name: "giscus_comments", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }


  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false   # Because project pages contain Bootstrap + Liquid includes
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Header Image", name: "img", widget: "image", required: false }
      - { label: "Importance", name: "importance", widget: "number", value_type: "int", default: 1 }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - Normal
          - Featured
          - Research
          - Misc
        default: Normal
      - { label: "Related Publications", name: "related_publications", widget: "boolean", default: true }
      - { label: "Use MathJax", name: "usemathjax", widget: "boolean", default: false }
      - { label: "Giscus Comments", name: "giscus_comments", widget: "boolean", default: true }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Markdown + HTML + Liquid supported"
        }

  - name: "alevel"
    label: "A-Level Resources"
    folder: "_alevel"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false  # Liquid & complex Markdown: safer to disable preview
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page2" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Header Image", name: "img", widget: "image", required: false }
      - { label: "Importance", name: "importance", widget: "number", value_type: "int", default: 1 }
      - { label: "Use MathJax", name: "usemathjax", widget: "boolean", default: false }
      - { label: "Giscus Comments", name: "giscus_comments", widget: "boolean", default: true }

      - label: "Table of Contents"
        name: "toc"
        widget: "object"
        required: false
        fields:
          - label: "Sidebar Position"
            name: "sidebar"
            widget: "select"
            options: ["left", "right"]
            required: false

      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Markdown + HTML supported"
        }

